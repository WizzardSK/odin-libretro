# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# This recipe is consumed by the Libretro buildbot so the Odin core can be
# distributed through RetroArch's Online Updater > Core Downloader.
#
# Linux x64/aarch64 and Windows x64. Odin is C++20 with <format> (GCC 13) and
# compiles its Vulkan shaders with glslangValidator at build time, so the jobs
# run on Ubuntu with those, as the project's GitHub CI
# (.github/workflows/libretro.yml) does. The core takes Odin's version from
# its last release tag (src/odin/libretro/libretro.cmake), hence the full
# clone. The shared MAME sets hikaru.zip and mie.zip go in <system>/odin.

# Core definitions
.core-defs:
  variables:
    CORENAME: odin
    GIT_DEPTH: "0"

# Only the three submodules the core builds (GLEW, jansson, Vulkan-Headers)
# are fetched; overriding before_script drops the template's NUMPROC, hence
# the re-export
.core-deps-linux:
  image: ubuntu:22.04
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - '[ "$NUMPROC" -ge 1 ] || NUMPROC=1'
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends
        software-properties-common gpg-agent ca-certificates git cmake ninja-build
        glslang-tools gawk libopengl-dev libgl-dev binutils
    - add-apt-repository -y ppa:ubuntu-toolchain-r/test
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends gcc-13 g++-13
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git submodule update --init --depth 1 3rdparty/glew 3rdparty/jansson 3rdparty/Vulkan-Headers
    # glibc 2.35; GCC 13's libstdc++ linked into the core
    - cmake -B build -G Ninja -DODIN_LIBRETRO=ON -DODIN_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
        -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
    - cmake --build build -j${NUMPROC}
    - mv build/${CORENAME}_libretro.so ${CORENAME}_libretro.so
    - strip --strip-unneeded ${CORENAME}_libretro.so

include:
  ################################## DESKTOP ##################################
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

##############################################################################
#################################### STAGES ##################################
##############################################################################
#
################################### DESKTOP ##################################
# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64
    - .core-deps-linux
    - .core-defs

# Linux aarch64
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64
    - .core-deps-linux
    - .core-defs

# Windows 64-bit, cross-built with MinGW-w64 (GCC 13, POSIX threads), the
# runtime linked in (libretro.cmake): the core needs only system DLLs
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw
    - .core-defs
  image: ubuntu:24.04
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - '[ "$NUMPROC" -ge 1 ] || NUMPROC=1'
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends
        ca-certificates git cmake ninja-build glslang-tools gawk mingw-w64
    - update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
    - update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git submodule update --init --depth 1 3rdparty/glew 3rdparty/jansson 3rdparty/Vulkan-Headers
    - cmake -B build -G Ninja -DODIN_LIBRETRO=ON -DODIN_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64
        -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
        -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
        -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32
        -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
        -DCMAKE_C_FLAGS=-march=x86-64-v2 -DCMAKE_CXX_FLAGS=-march=x86-64-v2
    - cmake --build build -j${NUMPROC}
    - mv build/${CORENAME}_libretro.dll ${CORENAME}_libretro.dll
    - x86_64-w64-mingw32-strip --strip-unneeded ${CORENAME}_libretro.dll
